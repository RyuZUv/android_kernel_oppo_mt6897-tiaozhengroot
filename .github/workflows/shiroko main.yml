name: 欧加真mt6897内核编译

env:
  TZ: Asia/Shanghai
  CPU: 'mt6897'
  FEIL: 'oplus'
  ANDROID_VERSION: 'android14'
  KERNEL_VERSION: '6.1'
  KERNEL_NAME: 'ShirokoNeko_kernel'
  KERNELSU_VARIANT: 'SukiSU-Ultra'
  KERNELSU_BRANCH: 'susfs-dev'

on:
  workflow_dispatch:
    inputs:
      lz4k_enable:
        description: '是否安装 LZ4K 补丁'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      scx_enable:
        description: '是否安装风驰内核驱动'
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'
      kernel_suffix:
        description: '内核后缀(留空默认，开头别加连字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
    steps:
      # ========== 初始化环境 ==========
      - name: 开始最大化建筑空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 16384
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装配置环境所需依赖组件
        run: |
          sudo apt update
          sudo apt install -y llvm clang cmake \
            curl bison flex make binutils dwarves \
            git lld pahole zip perl gcc \
            python3 python-is-python3 bc \
            libssl-dev libelf-dev
          sudo wget https://apt.llvm.org/llvm.sh
          sudo chmod +x llvm.sh
          # 安装 LLVM 20 稳定版
          sudo ./llvm.sh 20 all
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-20 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-20 100

      # ========== 源码准备阶段 ==========
      - name: 初始化私有源码仓库
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace && cd kernel_workspace
          echo "正在克隆私有源码仓库..."
          git clone --depth=1 https://github.com/Winkmoon/android_kernel_oppo_mt6897 common -b onepluspad
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm -f common/android/abi_gki_protected_exports_* || echo "不需要去除保护"
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion

      # ========== KernelSU 集成 ==========
      - name: 开始添加 SukiSU-Ultra
        id: ksu_version
        run: |
          cd kernel_workspace
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev
          cd KernelSU
          KSU_VERSION=$(expr $(git rev-list --count main) + 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=$KSU_VERSION/" kernel/Makefile

      # ========== 补丁应用阶段 ==========
      - name: 应用 SUSFS 修补程序 SukiSU-Ultra
        run: |
          cd kernel_workspace
          git clone https://github.com/ShirkNeko/susfs4ksu.git -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
          # 增加补丁验证步骤
          if [ ! -f ./common/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ]; then
            echo "补丁文件不存在！"
            exit 1
          fi
          cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          cp ./SukiSU_patch/hooks/new_hooks.patch ./common/
          cd ./common
          # 增加补丁应用验证
          if ! patch --dry-run -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch; then
            echo "补丁应用失败！"
            exit 1
          fi
          patch -p1 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
          patch -p1 < new_hooks.patch

      - name: 应用 Hide Stuff 修补程序
        run: |
          cd kernel_workspace/common
          cp ../SukiSU_patch/69_hide_stuff.patch ./
          patch -p1 < 69_hide_stuff.patch

      - name: 应用 lz4k 补丁
        if: ${{ github.event.inputs.lz4k_enable == 'true' }}
        run: |
          cd kernel_workspace/common
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./crypto
          cp ../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch .
          patch -p1 -F 3 < lz4kd.patch || true

      # ========== 内核配置阶段 ==========
      - name: 添加 SUSFS 配置设置
        run: |
          cd kernel_workspace/common
          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF
          sed -i 's/check_defconfig//' build.config.gki

      - name: 添加内核附加名称
        run: |
          cd kernel_workspace/common/scripts
          suffix="${{ github.event.inputs.kernel_suffix || env.KERNEL_NAME }}"
          sed -i "\$s|echo \"\\\$res\"|echo \"-$suffix\"|" setlocalversion

    

      # ========== 编译阶段 ==========
      

            - name: 开始构建kernel啦
        run: |
          cd kernel_workspace/common
          sed -i '/oplus/d' Kconfig.ext
          sed -i '/oplus/d' drivers/soc/Kconfig
          echo "CONFIG_MODULE_SIG=n" >> arch/arm64/configs/gki_defconfig
          cd kernel/locking
          rm -rf locking_main.h || echo "无需删除"
          wget https://github.com/Carl1984/oppo_oplus_realme_sm8650/raw/main/patches/locking_main.h
          rm -rf oplus_locking.c || echo "无需删除"
          wget https://github.com/Carl1984/oppo_oplus_realme_sm8650/raw/main/patches/oplus_locking.c
          cd  ../../
          wget https://github.com/Carl1984/oppo_oplus_realme_sm8650/raw/main/patches/sa_common_struct.h
          rm -rf kernel/locking/sa_common_struct.h || echo "无需删除"
          cp -f sa_common_struct.h kernel/locking/          
          wget https://github.com/huifanghf/android_kernel_modules_oneplus_mt6895/raw/15/oplus/kernel/mm/mm_osvelte/mm-trace.h
          rm -rf mm/mm-trace.h || echo "不需要删除"
          cp -f mm-trace.h mm/
          make -j$(nproc) LLVM=-20 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang LD=ld.lld O=out \
            KCFLAGS+=-Wno-error gki_defconfig all     
      
      # ========== 后处理阶段 ==========
      - name: 应用patch_linux并修补内核
        run: |
          cd kernel_workspace/common/out/arch/arm64/boot
          curl -LO https://github.com/ShirkNeko/SukiSU_KernelPatch_patch/releases/download/0.11-beta/patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image

      - name: 克隆 AnyKernel3 并打包
        run: |
          cd kernel_workspace
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          cp common/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip_name="AnyKernel3_SukiSU_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}_A14"
          [[ -n "${{ github.event.inputs.kernel_suffix }}" ]] && \
            zip_name+="_${{ github.event.inputs.kernel_suffix }}" || \
            zip_name+="_${{ env.KERNEL_NAME }}"
          zip -r9 ../${zip_name}.zip ./*

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_ZIP_${{ github.run_number }}
          path: kernel_workspace/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: Kernel_ZIP_${{ github.run_number }}
          path: ./release_zips

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ github.run_number }}"
          name: "${{ env.KERNEL_NAME }} Build #${{ github.run_number }}"
          body: |
            ### 📱 欧加真 Android 14 SukiSU-Ultra mt6897 通用内核 | 构建信息
            - 内核版本: ${{ env.KERNEL_VERSION }}
            - Android 版本: ${{ env.ANDROID_VERSION }}
            - 处理器平台: ${{ env.CPU }}
            - 特性: SukiSU Ultra + SUSFS + VFS + KPM
            - LZ4K支持: ${{ github.event.inputs.lz4k_enable }}
            - 风驰内核支持: ${{ github.event.inputs.scx_enable }}
            - 推荐系统: ColorOS 14 / RealmeUI 5.0
            ### 📋 安装指南
            1. 使用第三方Recovery刷入
            2. 通过HorizonKernelFlasher刷入
            3. 通过SukiSU管理器直接更新
          draft: false
          prerelease: false
          files: |
            release_zips/*.zip
